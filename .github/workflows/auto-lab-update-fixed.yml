name: Auto publish LAB update

on: [push, workflow_dispatch]

permissions:
  contents: write

concurrency:
  group: fire-direction-lab-update
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh update.json
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          root = Path(".")
          rx = re.compile(
              r"^FIRE_DIRECTION_LAB_v(\d+)\.(\d+)\.(\d+)\.(\d+).*\.html$",
              re.I
          )

          found = []
          for p in root.glob("FIRE_DIRECTION_LAB_v*.html"):
              m = rx.match(p.name)
              if m:
                  ver = tuple(map(int, m.groups()))
                  found.append((ver, p))

          if not found:
              print("LAB 버전 HTML이 저장소 최상위에 없어 update.json을 건드리지 않습니다.")
              raise SystemExit(0)

          (major, minor, patch, rev), game = max(found, key=lambda x: x[0])

          # 기존 LAB 규칙:
          # 2.30.7.124 -> 23007124
          # 2.30.8.0   -> 23008000
          build = (
              major * 10_000_000
              + minor * 100_000
              + patch * 1_000
              + rev
          )

          version = f"{major}.{minor}.{patch}.{rev}"
          sha256 = hashlib.sha256(game.read_bytes()).hexdigest()

          data = {
              "version": version,
              "build": build,
              "file": game.name,
              "sha256": sha256,
              "notes": f"FIRE DIRECTION LAB v{version}",
              "mandatory": False
          }

          Path("update.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print(f"version = {version}")
          print(f"build   = {build}")
          print(f"file    = {game.name}")
          print(f"sha256  = {sha256}")
          PY

      - name: Commit update.json if changed
        shell: bash
        run: |
          if git diff --quiet -- update.json; then
            echo "update.json already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update.json
          git commit -m "chore: publish latest LAB update"
          git push
